# ServiceAccount federated to a User-Assigned Managed Identity via
# AKS Workload Identity. Replace REPLACE_WITH_UAMI_CLIENT_ID below with the
# client ID of the UAMI you created per k8s/README.md, or patch it at apply
# time via `kubectl -n aoai-benchmark annotate sa aoai-benchmark-sa
# azure.workload.identity/client-id=<uuid> --overwrite`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aoai-benchmark-sa
  namespace: aoai-benchmark
  annotations:
    azure.workload.identity/client-id: "REPLACE_WITH_UAMI_CLIENT_ID"
  labels:
    app.kubernetes.io/name: aoai-benchmark
    azure.workload.identity/use: "true"
