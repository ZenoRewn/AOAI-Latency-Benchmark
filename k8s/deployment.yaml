apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoai-benchmark
  namespace: aoai-benchmark
  labels:
    app.kubernetes.io/name: aoai-benchmark
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aoai-benchmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aoai-benchmark
        # Required for AKS Workload Identity to inject federated tokens
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: aoai-benchmark-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with your registry image, e.g. myacr.azurecr.io/aoai-benchmark:<sha>
          image: REPLACE_WITH_IMAGE:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aoai-benchmark-config
          env:
            # Optional fallback: plain API key. Leave the Secret absent if
            # you only want Workload Identity — the code tolerates this.
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aoai-benchmark-secrets
                  key: AZURE_OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
